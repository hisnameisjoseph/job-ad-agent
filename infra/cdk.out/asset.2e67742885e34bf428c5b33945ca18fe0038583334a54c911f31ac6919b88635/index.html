<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Matcher</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header class="masthead">
    <div class="masthead-main">
      <h1>job matches</h1>
      <p class="count" id="count">loading&hellip;</p>
    </div>

    <!-- Revealed only when the page is deployed behind Cognito. Locally there
         is no /config.json, so auth stays off and this bar stays hidden. -->
    <div class="authbar" id="authbar" hidden>
      <span class="who" id="who"></span>
      <button type="button" class="btn" id="signin" hidden>Sign in with Google</button>
      <button type="button" class="btn btn-quiet" id="signout" hidden>Sign out</button>
    </div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main>
    <table id="jobs">
      <thead>
        <tr>
          <th class="col-score">Fit</th>
          <th>Role</th>
          <th>Company</th>
          <th>Posted</th>
          <th>Location</th>
          <th>Call</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <p class="empty" id="empty" hidden>
      No jobs scored yet. Run <code>python main.py</code> to populate this list.
    </p>
  </main>

  <!-- type="module" so app.js can import the auth helpers. -->
  <script type="module" src="/app.js"></script>
</body>

</html>
