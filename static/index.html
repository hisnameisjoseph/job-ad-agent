<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Home-screen install. The CloudFront domain never changes between
       deploys, so "Add to Home Screen" gives a permanent icon and you never
       have to find the link again. -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jobs">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <title>Job Matcher</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header class="masthead">
    <div class="masthead-main">
      <h1>job matches</h1>
      <p class="count" id="count">loading&hellip;</p>
    </div>

    <div class="authbar">
      <!-- Outside #authbar on purpose: that bar is hidden until Cognito is in
           front of the page, and settings must stay reachable locally too. -->
      <a class="btn btn-quiet" href="/settings.html">Settings</a>

      <!-- Revealed only when the page is deployed behind Cognito. Locally
           there is no /config.json, so auth stays off and this stays hidden. -->
      <span class="authbar" id="authbar" hidden>
        <span class="who" id="who"></span>
        <button type="button" class="btn" id="signin" hidden>Sign in with Google</button>
        <button type="button" class="btn btn-quiet" id="signout" hidden>Sign out</button>
      </span>
    </div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main>
    <table id="jobs">
      <thead>
        <tr>
          <th class="col-score">Fit</th>
          <th>Role</th>
          <th>Company</th>
          <th>Posted</th>
          <th>Location</th>
          <th>Call</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <p class="empty" id="empty" hidden>
      No jobs scored yet. Run <code>python main.py</code> to populate this list.
    </p>
  </main>

  <!-- type="module" so app.js can import the auth helpers. -->
  <script type="module" src="/app.js"></script>
</body>

</html>
